# Prose rules for the Barrios Visibles paper. The styles derive from
# portolan-sdi/portolan-ops, with the rules that name that project removed.
#
# Three layers apply to every prose file:
#   Paper-Terms      casing of tool and format names, plus hype words
#   Paper-Mechanics  punctuation, capitalization, spacing
#   Paper-Voice      the voice rules every surface shares
#
# One surface style applies per path: Paper-Docs is the only one here.
#
# The ai-tells package adds rules for figurative language, hype words, and
# filler. Six of its rules are off. Each disable below states the reason.
#
# Vale replaces BasedOnStyles on the most specific matching glob rather than
# merging it, so every section names each style it needs.

StylesPath = styles
MinAlertLevel = suggestion

# A term listed in styles/config/vocabularies/Paper/accept.txt is skipped by
# every other check. Keep a word out of accept.txt when a rule must match on
# it.
Vocab = Paper
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/readability/releases/download/v0.1.1/Readability.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.33.0/ai-tells.zip

[*.{md,mdx}]
BasedOnStyles = Vale, Paper-Terms, Paper-Mechanics, Paper-Voice, Paper-Docs, Google, Microsoft, Readability, ai-tells

Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)

# Google rules that fight the house voice or duplicate a local rule.
Google.We = NO
Google.Contractions = NO
Google.WordList = NO
Google.Headings = NO
Google.Parens = NO
Google.Quotes = NO
Google.Acronyms = NO
Google.Colons = NO
Google.Passive = NO
Google.OxfordComma = NO
Google.Ellipses = NO
# Paper-Mechanics.EmDash owns the em dash. It requires spaces; Google does not.
Google.EmDash = NO
# Reports 'supply-chain', which is a correct compound adjective.
Google.LyHyphens = NO
# A single-author paper writes 'I'. The rule reports correct prose.
Google.FirstPerson = NO

# Keep the Microsoft checks that add distinct editorial value. These conflict
# with local conventions, duplicate a local rule, or report a domain term.
Microsoft.Contractions = NO
Microsoft.Auto = NO
Microsoft.Dashes = NO
Microsoft.Ellipses = NO
Microsoft.FirstPerson = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Quotes = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Terms = NO
Microsoft.Uppercase = NO
Microsoft.Vocab = NO
# Demands the expansion of every acronym on first use. A paper defines its
# terms once and then uses them, and the rule reports each later use.
Microsoft.Acronyms = NO

# ARI and Flesch Reading Ease show the trend. Their targets stay suggestions,
# because technical names raise prose scores.
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

# ai-tells rules that conflict with a rule this repo owns, or that report an
# exact technical word.
#
# It bans the em dash. Paper-Mechanics.EmDash requires a spaced em dash and
# limits the count per file. Keep one owner.
ai-tells.EmDashUsage = NO
# Google.Semicolons warns on the semicolon. Keep one rule for it.
ai-tells.SemicolonUsage = NO
# Its message gives the contraction "doesn't" as the fix. Google.Contractions
# is off here.
ai-tells.NegatedObject = NO
# It reports "implements", which is exact in a methods section.
ai-tells.FormalRegister = NO
# It reports a run-in bold label, such as "**Note:** ...", which opens a
# paragraph. vale-ai-tells turns it off in its own repository.
ai-tells.ColonUsage = NO
# Every match is a CLI flag inside a code span. Vale masks a code span before
# it matches, but a punctuation token still reports at the raw position inside
# the mask. tbhb/vale-ai-tells records the limitation in its TODO.md.
ai-tells.DoubleHyphen = NO

# Working-paper voice. Longer sentences are allowed, and the academic
# conventions below differ from the documentation conventions above.
[paper/**]
BasedOnStyles = Vale, Paper-Terms, Paper-Mechanics, Paper-Voice, Paper-Article, Google, Microsoft, Readability, ai-tells

Vale.Spelling = NO
# The last pattern skips text inside double quotes. A paper quotes its
# sources verbatim, in Spanish here, and no rule may rewrite a quotation.
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+), ("[^"]+")
# The reference list is quoted text: published titles, Spanish titles, and
# author initials. Vale reported 9 errors inside it, and every fix would
# have falsified a citation. Skip the block.
BlockIgnores = (?s)## References.*

# Google and Microsoft rules that fight the house voice or duplicate a local
# rule. The list matches the docs section above.
Google.We = NO
Google.Contractions = NO
Google.WordList = NO
Google.Headings = NO
Google.Parens = NO
Google.Quotes = NO
Google.Acronyms = NO
Google.Colons = NO
Google.Passive = NO
Google.OxfordComma = NO
Google.Ellipses = NO
Google.EmDash = NO
Google.LyHyphens = NO
Google.FirstPerson = NO
Microsoft.Contractions = NO
Microsoft.Auto = NO
Microsoft.Dashes = NO
Microsoft.Ellipses = NO
Microsoft.FirstPerson = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Quotes = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Terms = NO
Microsoft.Uppercase = NO
Microsoft.Vocab = NO
Microsoft.Acronyms = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

# ai-tells rules that conflict with a rule this repo owns, or that report an
# exact technical word. The list matches the docs section above.
ai-tells.EmDashUsage = NO
ai-tells.SemicolonUsage = NO
ai-tells.NegatedObject = NO
ai-tells.FormalRegister = NO
ai-tells.ColonUsage = NO
ai-tells.DoubleHyphen = NO

# Rules below this line apply to the documentation and not to the paper.
#
# A paper numbers its sections and sets the headings in title case, such as
# '2. Data sources' and '4.1 Counting building footprints'. The rule also
# cannot parse the '4.1' prefix.
Paper-Mechanics.Headings = NO
# The paper argues in long subordinated sentences, and the em dash carries
# that structure. Paper-Mechanics.EmDash still requires the spaces.
Paper-Mechanics.EmDashDensity = NO
# The paper cites decrees and resolutions by their published date, which
# Argentina writes day first: '31 December 2016'.
Google.DateFormat = NO
Microsoft.DateFormat = NO
# 'robust' is a statistical term in the results section, not a hype word.
Paper-Terms.Hype = NO
# It reports 'certainly'. The paper uses 'almost certainly' to grade a claim
# it can support but has not measured, which is weaker than a bare assertion
# and stronger than 'probably'. The hedge carries the author's confidence,
# so keep the word and drop the rule here.
ai-tells.SycophancyMarkers = NO

# Vendored, generated, or machine-written text.
[**/{node_modules,.venv,venv,vendor,site-packages,worktrees,.git}/**]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

[**/.pytest_cache/**]
BasedOnStyles =

[**/{LICENSE,LICENCE,COPYING,NOTICE,CHANGELOG}*.{md,mdx}]
BasedOnStyles =
